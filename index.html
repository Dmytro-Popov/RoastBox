<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/app/css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-container">
        <div class="logo">
          <img src="app/img/Logo_RoustBox.png" alt="Logo RoustBox" />
        </div>
        <div>
          <nav class="nav">
            <ul class="nav-list">
              <li><a href="#">Home</a></li>
              <li><a href="#">Kaffee</a></li>
              <li><a href="#">Über uns</a></li>
              <li><a href="#">So funktioniert's</a></li>
              <li><a href="#">Kontakt</a></li>
            </ul>
          </nav>
        </div>
      </div>
    </header>

    <main>
      <section class="clients">
        <div class="container">
          <h2>Vertraut von Kaffeeliebhabern</h2>
          <ul class="clients-list">
            <li>
              <img
                src="./app/img/clients/daily-blend.jpeg"
                alt="Logo von The Daily Blend mit Kaffeebohne, Buch und Wachstumspfeil unter einem Bogen"
                width="138"
                height="110"
              />
            </li>
            <li>
              <img
                src="./app/img/clients/daily-brew-cafe.jpeg"
                alt="Logo von Daily Brew Cafe mit einer dampfenden Kaffeetasse"
                width="138"
                height="110"
              />
            </li>
            <li>
              <img
                src="./app/img/clients/daily-brew.jpeg"
                alt="Logo von Daily Brew Cafe mit einer Kaffeebohne im Schlüsselloch"
                width="138"
                height="110"
              />
            </li>
            <li>
              <img
                src="./app/img/clients/old-grind.jpeg"
                alt="Logo von Old Grind Roasting House mit einer alten Handkaffeemühle"
                width="138"
                height="110"
              />
            </li>
            <li>
              <img
                src="./app/img/clients/mornings-matter.jpeg"
                alt="Logo von Mornings Matter mit Kaffeewagen vor aufgehender Sonne"
                width="138"
                height="110"
              />
            </li>
          </ul>
        </div>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
